name: CI/CD Pipeline

on:
  push:
    paths:
      - 'chatbot-new-frontend/**'
    branches:
      - 'main'
  pull_request:
    paths:
      - 'chatbot-new-frontend/src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Debug:Print next.config.mjs to confirm fix
        run: cat chatbot-new-frontend/next.config.mjs

      - name: Install dependencies
        working-directory: chatbot-new-frontend
        run: npm install

      - name: Build project
        working-directory: chatbot-new-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
      
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: novife

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy novife-frontend \
            --source=./chatbot-new-frontend \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated

