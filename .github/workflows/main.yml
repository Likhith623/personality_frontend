name: CI/CD Pipeline

on:
  push:
    paths:
      - 'chatbot-new-frontend/**'
    branches:
      - 'main'
  pull_request:
    paths:
      - 'chatbot-new-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Needed for Workload Identity Federation
      contents: read    # To checkout code

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Print next.config.mjs (debug)
        run: cat chatbot-new-frontend/next.config.mjs

      - name: Install dependencies
        working-directory: chatbot-new-frontend
        run: npm install

      - name: Build project
        working-directory: chatbot-new-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: 'projects/283192146773/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@novife.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Debug Authentication
        run: |
          echo "gcloud auth list:"
          gcloud auth list
          echo "gcloud config list:"
          gcloud config list
          echo "Access token:"
          gcloud auth print-access-token
          echo "GOOGLE_APPLICATION_CREDENTIALS:"
          echo $GOOGLE_APPLICATION_CREDENTIALS

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy novife-frontend \
            --source=./chatbot-new-frontend \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated
