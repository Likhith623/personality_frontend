name: CI/CD Pipeline

on:
  push:
    paths:
      - 'chatbot-new-frontend/**'
    branches:
      - 'main'
  pull_request:
    paths:
      - 'chatbot-new-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: chatbot-new-frontend
        run: npm install

      - name: Build project
        working-directory: chatbot-new-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM (Dev)
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ~/chatbot-new-frontend || git clone https://github.com/${{ github.repository }}.git && cd chatbot-new-frontend
            git pull origin main
            npm install
            npm run build
            pm2 restart all || pm2 start npm --name 'novife-dev' -- run start
          "

  approval:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Await manual approval
        run: echo "Waiting for production deployment approval..."

  deploy-prod:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM (Prod)
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ~/chatbot-new-frontend || git clone https://github.com/${{ github.repository }}.git && cd chatbot-new-frontend
            git pull origin main
            npm install
            npm run build
            pm2 restart all || pm2 start npm --name 'novife-prod' -- run start
          "
